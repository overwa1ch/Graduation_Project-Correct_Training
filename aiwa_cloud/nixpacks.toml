# Nixpacks configuration for Railway deployment
# https://nixpacks.com/docs/configuration/file

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["cd core-api && npm ci"]

[phases.build]
cmds = ["cd core-api && npx prisma generate && npm run build"]

[start]
cmd = "cd core-api && npx prisma migrate deploy && npm start"

