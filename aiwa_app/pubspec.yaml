name: aiwa_app
description: AIWA app (Flutter trajectory tracker)
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Core app services
  path_provider: ^2.1.5
  intl: any
  archive: ^3.4.9

  # Video import, playback, and tracking
  image_picker: ^1.0.7
  video_player: ^2.10.1
  path: ^1.8.3
  file_picker: ^10.3.10

  # Networking and local persistence
  http: ^1.1.0
  shared_preferences: ^2.2.2
  # Provides libsqlite3.so for aiwa_core NativeDatabase on Android/iOS
  sqlite3_flutter_libs: ^0.5.22

  # Editor and state management
  provider: ^6.1.2
  dart_quill_delta: ^10.8.3
  aiwa_core:
    path: ../aiwa_core
  appflowy_editor: 6.2.0
  flutter_quill: ^11.5.0
  opencv_dart: ^1.4.5
  gal: ^2.3.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  intl: any
  # Use local opencv_dart to avoid "Cannot operate on packages inside the cache" when building from pub cache
  opencv_dart:
    path: packages/opencv_dart

flutter:
  uses-material-design: true

  # Design tokens from Figma
  assets:
    - assets/tokens/
    - assets/config/
    - assets/rules/
