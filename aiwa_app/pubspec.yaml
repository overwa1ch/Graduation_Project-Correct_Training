name: aiwa_app
description: AIWA app (Flutter + ML Kit)
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ML Kit 姿态识别（后面里程碑 B 要用）
  google_mlkit_pose_detection: ^0.14.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  archive: ^3.4.9
  
  # 视频录制与分析
  image_picker: ^1.0.7
  video_player: ^2.8.2
  path: ^1.8.3
  
  # 网络和存储
  http: ^1.1.0
  shared_preferences: ^2.2.2
  
  # MoveNet 姿态识别
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  
  aiwa_core:
    path: ../aiwa_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Design tokens from Figma
  assets:
    - assets/tokens/
    - assets/config/
    - assets/rules/
    - assets/models/

