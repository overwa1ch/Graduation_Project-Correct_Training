name: aiwa_app
description: AIWA app (Flutter + ML Kit)
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ML Kit 姿态识别（后面里程碑 B 要用）
  google_mlkit_pose_detection: ^0.14.0
  aiwa_core:
    path: ../aiwa_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Design tokens from Figma
  assets:
    - assets/tokens/
    - assets/config/

