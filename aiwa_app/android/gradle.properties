org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
# Disable Kotlin incremental compilation to avoid cross-drive path issues
kotlin.incremental=false
# Prevent Gradle from using project build directory for external plugins
# This helps avoid cross-drive path conflicts (D: project with C: pub cache)
org.gradle.unsafe.configuration-cache=false
